# =============================================================================
# Sump Pump Monitor — Template Sensors
# =============================================================================
# Five template sensors for display and calculation.
#
# YAML OPTION: Add this template: block to your configuration.yaml, or
# reference via:
#   template: !include templates.yaml
#
# UI OPTION: If creating as flow-based UI helpers (Settings → Helpers →
# Add Helper → Template → Sensor), you must paste the state template into
# the UI editor and save. The YAML expressions below cannot be written via
# the API for this helper type — the UI editor is required.
# See INSTALL.md Step 2 for detailed UI instructions.
#
# ITEMS REQUIRING CUSTOMIZATION are marked with: # <<< CONFIGURE
# "Sump Running" is the only sensor here with an external reference —
# replace sensor.your_sump_power_sensor with the same power sensor used in
# the automation files. Its 20W threshold is deliberately lower than the
# automations' 50W — see the comment on that sensor below.
# =============================================================================

template:
  - sensor:

      # Interval between sump runs in human-readable format.
      # Displays as HH:MM for intervals under 24 hours,
      # or "N days, HH:MM" for longer intervals (e.g. winter, dry periods).
      - name: "Sump Pump Interval Formatted"
        icon: mdi:timer
        state: >
          {% set total_minutes = states('sensor.sump_pump_interval') | float(0) | int %}
          {% set days = (total_minutes // 1440) | int %}
          {% set hours = ((total_minutes % 1440) // 60) | int %}
          {% set mins = (total_minutes % 60) | int %}
          {% if days > 0 %}
            {{ days }} day{{ 's' if days != 1 }}, {{ '%02d:%02d' | format(hours, mins) }}
          {% else %}
            {{ '%02d:%02d' | format(hours, mins) }}
          {% endif %}

      # Time since last sump run in human-readable format.
      # Same HH:MM / N days, HH:MM format as above.
      - name: "Sump Pump Last Run Formatted"
        icon: mdi:clock-outline
        state: >
          {% set total_minutes = states('sensor.sump_pump_time_since_last_run') | float(0) | int %}
          {% set days = (total_minutes // 1440) | int %}
          {% set hours = ((total_minutes % 1440) // 60) | int %}
          {% set mins = (total_minutes % 60) | int %}
          {% if days > 0 %}
            {{ days }} day{{ 's' if days != 1 }}, {{ '%02d:%02d' | format(hours, mins) }}
          {% else %}
            {{ '%02d:%02d' | format(hours, mins) }}
          {% endif %}

      # Interval between sump runs in minutes.
      # Derived from sump_last_interval (stored in seconds).
      # Source for sump_pump_interval_rolling_average statistics sensor.
      - name: "Sump Pump Interval"
        unit_of_measurement: "min"
        icon: mdi:timer-sand
        state: >
          {{ (states('input_number.sump_last_interval') | float(0) / 60) | round(1) }}

      # Time since last sump run in minutes.
      # Recalculates continuously from sump_last_run timestamp.
      # Used in the "not running" alert notification message.
      - name: "Sump Pump Time Since Last Run"
        unit_of_measurement: "min"
        icon: mdi:clock-start
        state: >
          {% set last = as_timestamp(states('input_datetime.sump_last_run')) %}
          {% if last %}
            {{ ((now().timestamp() - last) / 60) | round(1) }}
          {% else %}
            0
          {% endif %}

      # Simple on/off indicator for whether the sump is currently running.
      # Handy as a boolean dashboard tile separate from the raw wattage
      # sensor, and the source for the history_stats sensors in
      # sump_history_stats.yaml (today's run count and run time).
      #
      # Uses a 20W threshold — intentionally lower than the automations' 50W.
      # A lower threshold counts more of each run's ramp-up/ramp-down as
      # "running", which is what the run-time total should measure; the
      # automations only need a clean start/stop edge. Adjust both to suit
      # your pump (INSTALL.md Step 1b).
      # <<< CONFIGURE: sensor.your_sump_power_sensor and the 20W threshold
      - name: "Sump Running"
        icon: mdi:water-pump
        state: >
          {% if states('sensor.your_sump_power_sensor') | float(0) > 20 %}
            true
          {% else %}
            false
          {% endif %}
